# --- Script de sauvegarde automatisé ---
cat > /usr/local/bin/backup_server.sh <<'EOF'
#!/bin/bash
export BORG_PASSPHRASE="MaPassphraseTresSecrete123"
REPOSITORY="/var/backups/borg-repo"

# Création de l'archive (avec horodatage)
borg create --stats --progress $REPOSITORY::"backup-$(date +%Y-%m-%d_%H-%M)" \
    /var/www/monapp \
    /etc/nginx \
    /etc/lemonldap-ng

# Pruning (Rétention selon doc : 7 jours, 4 semaines)
borg prune -v --keep-daily=7 --keep-weekly=4 $REPOSITORY
EOF

# --- fin du script ---

# --- Planification quotidienne à 03h00 ---
(crontab -l 2>/dev/null; echo "0 3 * * * /usr/local/bin/backup_server.sh") | crontab -

# --- fichier executable ---
sudo chmod +x /usr/local/bin/backup_server.sh