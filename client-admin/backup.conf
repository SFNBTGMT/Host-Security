#Pour valider la règle sans ajouter de services tiers (conformément à votre Politique Zero Trust et de Réduction de la surface d'attaque), 
#vous devez utiliser le poste client-admin (172.28.128.222) comme lieu de stockage déporté.
#Voici l'architecture à appliquer en mode PULL (Sécurisé) :
#Emplacement des 3 copies requis :
Copie 1 (Originale) : Sur server-hardening (dans /var/www/monapp etc.) 
Copie 2 (Locale) : Le dépôt Borg actuel dans /var/backups/ sur server-hardening.
Copie 3 (Hors-site/Isolée) : Un second dépôt Borg hébergé de manière sécurisée sur client-admin.

# -- sur client-admin --
# lancer la sauvegarde PULL complète 
sudo nano /usr/local/bin/pull_backup.sh
#-----------------------
#!/bin/bash
set -euo pipefail

# Configuration
TARGET_IP="172.28.128.221"
SSH_KEY="/home/vagrant/.ssh/id_ed25519"
TMP_DIR="/tmp/backup_source"
REPO_LOCAL="/var/backups/borg-repo-local"
export BORG_PASSPHRASE="MaPassphraseTresSecrete123"

echo "=== Début du rapatriement Zero Trust : $(date) ==="

# 1. Recréation propre et cloisonnée de l'arborescence
rm -rf "$TMP_DIR"
mkdir -p "$TMP_DIR/var/www/monapp"
mkdir -p "$TMP_DIR/etc/nginx"
mkdir -p "$TMP_DIR/etc/lemonldap-ng"

# 2. Rapatriement étanche de chaque répertoire
echo "Rapatriement des données depuis $TARGET_IP..."

rsync -avz --delete --rsync-path="sudo rsync" -e "ssh -i $SSH_KEY -o StrictHostKeyChecking=accept-new" \
  vagrant@$TARGET_IP:/var/www/monapp/ "$TMP_DIR/var/www/monapp/"

rsync -avz --delete --rsync-path="sudo rsync" -e "ssh -i $SSH_KEY" \
  vagrant@$TARGET_IP:/etc/nginx/ "$TMP_DIR/etc/nginx/"

rsync -avz --delete --rsync-path="sudo rsync" -e "ssh -i $SSH_KEY" \
  vagrant@$TARGET_IP:/etc/lemonldap-ng/ "$TMP_DIR/etc/lemonldap-ng/"

# 3. Chiffrement et archivage Borg (Changement de dossier pour arborescence propre)
echo "Création de l'archive Borg..."
cd "$TMP_DIR"
borg create --stats \
  "$REPO_LOCAL::backup-$(date +%Y-%m-%d_%H-%M)" \
  .

# 4. Quitter le dossier temporaire avant sa suppression
cd /

# 5. Nettoyage du répertoire temporaire
echo "Nettoyage des fichiers temporaires..."
rm -rf "$TMP_DIR"

# 6. Rétention des archives (7 jours, 4 semaines)
echo "Application de la politique de rétention..."
borg prune -v --list --keep-daily=7 --keep-weekly=4 "$REPO_LOCAL"

# 7. Affichage final de contrôle des archives présentes
echo "Liste des archives à jour :"
borg list "$REPO_LOCAL"

echo "=== Sauvegarde terminée ==="

# ---------------------------
# le script exécutable 
sudo chmod +x /usr/local/bin/pull_backup.sh
# Pour lancer
sudo /usr/local/bin/pull_backup.sh
